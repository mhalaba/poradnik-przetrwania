<style>
  html,body{height:100%;overflow:hidden}
  #c{position:fixed;left:0;top:0;display:block;width:100vw;height:100vh;touch-action:none}
  .hud{position:fixed;left:0;right:0;top:0;padding:10px 12px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 230px)}
  .hud > *{pointer-events:auto}
  [hidden]{display:none !important}
  .pill{background:rgba(11,18,32,.72);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.86rem;backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap;transition:border-color .2s,transform .12s}
  button.pill:hover,a.pill:hover{transform:translateY(-1px);border-color:var(--accent)}
  body.kids .pill{background:rgba(255,255,255,.88);color:#2b2140;border-color:#ffd7a3}
  /* minimapa */
  #mmBox{position:fixed;right:12px;top:12px;z-index:6;width:200px;height:200px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.3);box-shadow:0 8px 30px rgba(0,0,0,.45);background:rgba(11,18,32,.6);backdrop-filter:blur(4px)}
  body.kids #mmBox{border-color:#ffd7a3}
  #mm{display:block;width:200px;height:200px}
  /* zoom */
  #zoomBox{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center}
  .zbtn{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(11,18,32,.72);color:#fff;font-size:1.35rem;font-weight:900;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:.15s;font-family:inherit}
  .zbtn:hover{border-color:var(--accent);transform:scale(1.06)}
  .zbtn:active{transform:scale(.94)}
  .zbtn.sm{width:36px;height:36px;font-size:1rem}
  body.kids .zbtn{background:rgba(255,255,255,.9);color:#2b2140;border-color:#ffd7a3}
  #zoomLevel{font-size:.72rem;font-weight:800;color:#fff;background:rgba(11,18,32,.6);padding:2px 8px;border-radius:999px;backdrop-filter:blur(6px)}
  body.kids #zoomLevel{background:rgba(255,255,255,.9);color:#2b2140}
  @media(max-width:820px){ .hud{max-width:100%;padding:8px} #mmBox{width:120px;height:120px;top:auto;bottom:12px;right:12px} #mm{width:120px;height:120px} #zoomBox{top:auto;bottom:150px;right:12px;transform:none} }
  #hint{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;max-width:min(560px,88vw)}
  #hint .pill{font-size:.9rem;display:inline-block;white-space:normal;line-height:1.4}
  #actBtn{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);z-index:6;display:none;font-size:1.05rem;padding:14px 26px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);z-index:6;display:none;touch-action:none}
  #joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7)}
  @media(pointer:coarse){#joy{display:block}}
  #panel{position:fixed;inset:0;background:rgba(5,10,20,.7);z-index:20;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
  #panel{backdrop-filter:blur(3px)}
  #panel .box{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);max-width:740px;width:100%;padding:26px;max-height:92vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.55);animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  #panel .box::-webkit-scrollbar{width:10px} #panel .box::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  #panel h2{margin-top:0}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0}
  .item{border:2px solid var(--line);background:var(--card2);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:.85rem;font-weight:700;user-select:none}
  .item .e{font-size:1.8rem;display:block}
  .item.sel{border-color:var(--accent);background:rgba(245,180,0,.15)}
  .item.good{border-color:var(--ok)}
  .item.badx{border-color:var(--bad);opacity:.6}
  .ord{list-style:none;padding:0;margin:10px 0}
  .ord li{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;display:flex;align-items:center;gap:10px;cursor:pointer}
  .ord li .n{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;flex:none}
  .ord li.sel{border-color:var(--accent)}
  .timer{font-weight:900;color:var(--accent2);font-size:1.2rem}
  .msg{background:var(--card2);border-radius:12px;padding:12px 14px;margin:8px 0;border-left:4px solid var(--accent)}
  .msg .acts{display:flex;gap:8px;margin-top:8px}
  .msg.good{border-left-color:var(--ok)} .msg.badm{border-left-color:var(--bad)}
  #intro .box{text-align:center}
  .missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:12px 0;text-align:left}
  .missions div{font-size:.8rem;padding:6px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
  .missions div.ok{border-color:var(--ok)}
  .stars{font-size:1.4rem;letter-spacing:2px}
  #miniad{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;width:320px;max-width:40vw;z-index:4;opacity:.9}
  #miniad .ad-slot{margin:0;min-height:90px}
  @media(max-width:1100px){#miniad{display:none}}
  #actBtn{transition:transform .12s} #actBtn:active{transform:translateX(-50%) scale(.96)}
</style>
